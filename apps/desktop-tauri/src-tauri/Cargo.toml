[package]
name = "t3code-desktop-tauri"
version = "0.0.1"
edition = "2021"
description = "Tauri shell for T3 Code (parallel to the Electron apps/desktop; milestone 1 walking skeleton)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiwebview (Window::add_child) for the preview
# subsystem's child webviews — the same shape the WS5 probe validated.
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Proxy target is always plain http on loopback, so no TLS features needed.
reqwest = { version = "0.12", default-features = false }
rand = "0.8"
dirs = "6"
base64 = "0.22"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# Connection-catalog encryption at rest (M3): AES-256-GCM with the key in the
# macOS keychain — the same shape Electron gets from safeStorage.
keyring = { version = "3", features = ["apple-native"] }
aes-gcm = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
