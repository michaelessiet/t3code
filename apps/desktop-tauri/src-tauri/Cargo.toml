[package]
name = "t3code-desktop-tauri"
version = "0.0.1"
edition = "2021"
description = "Tauri shell for T3 Code (parallel to the Electron apps/desktop; milestone 1 walking skeleton)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Proxy target is always plain http on loopback, so no TLS features needed.
reqwest = { version = "0.12", default-features = false }
rand = "0.8"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
