[package]
name = "vitre-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vitre"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-wry.workspace = true
lsp-types.workspace = true
percent-encoding.workspace = true
raw-window-handle.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
vitre-client.workspace = true
vitre-contracts.workspace = true
vitre-state.workspace = true
vitre-rpc.workspace = true
vitre-sidecar.workspace = true
wry.workspace = true

[dev-dependencies]
# Windowed tests: the vim keymap's arbitration against the input's own
# bindings is only meaningful through gpui's real dispatch pipeline.
gpui = { workspace = true, features = ["test-support"] }
